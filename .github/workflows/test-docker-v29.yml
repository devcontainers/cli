name: Docker v29 Tests

on:
  push:
    branches: ['main', 'docker-v29-issue-old', 'ci/pr1329-buildx-0.37.1']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test-docker-v29:
    name: Docker v29.0.0 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v6
    
    - uses: actions/setup-node@v5
      with:
        node-version: '20.x'
    
    - name: Install Docker v29.0.0
      run: |
        sudo apt-get remove -y docker-ce docker-ce-cli containerd.io || true
        curl -fsSL https://get.docker.com -o get-docker.sh
        sudo VERSION=29.0.0 sh get-docker.sh
        sudo systemctl restart docker
    
    - name: Pin Buildx for diagnostic run
      # Temporary comparison for https://github.com/devcontainers/cli/issues/1320.
      shell: bash
      run: |
        curl -fsSL https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64 \
          -o "$RUNNER_TEMP/buildx-v0.37.1.linux-amd64"
        curl -fsSL https://github.com/docker/buildx/releases/download/v0.37.1/checksums.txt \
          | grep ' \*buildx-v0\.37\.1\.linux-amd64$' \
          | (cd "$RUNNER_TEMP" && sha256sum -c -)
        install -D -m 755 "$RUNNER_TEMP/buildx-v0.37.1.linux-amd64" "$HOME/.docker/cli-plugins/docker-buildx"
        docker buildx version | grep -F 'v0.37.1 '

    - name: Verify Docker version, Install and Test
      run: |
        # Verify
        docker version
        DOCKER_VERSION=$(docker version --format '{{.Server.Version}}')
        if [[ ! "$DOCKER_VERSION" =~ ^29\. ]]; then
          echo "ERROR: Expected Docker v29.x but got $DOCKER_VERSION"
          exit 1
        fi      
        yarn install --frozen-lockfile
        yarn type-check
        yarn package
        yarn test-matrix --forbid-only src/test/cli.up.test.ts
      env:
        CI: true
